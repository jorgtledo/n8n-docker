version: '3.8'

volumes:
  n8n_pg_storage:
  n8n_data:
  n8n_redis_storage:
  n8n_httpsportal:

networks:
  n8n:
    driver: bridge

x-shared: &shared
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  restart: always
  environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres
    - DB_POSTGRESDB_PORT=5432
    - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
    - DB_POSTGRESDB_USER=${POSTGRES_USER}
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    - EXECUTIONS_MODE=queue
    - EXECUTIONS_DATA_SAVE_ON_ERROR=all
    - EXECUTIONS_DATA_PRUNE=true
    - EXECUTIONS_DATA_MAX_AGE=336
    - QUEUE_BULL_REDIS_HOST=redis
    - QUEUE_HEALTH_CHECK_ACTIVE=true
    - QUEUE_BULL_REDIS_PASSWORD=${REDIS_PASSWORD}
    - N8N_BASIC_AUTH_ACTIVE=false
    - N8N_HOST=${N8N_HOST}
    - N8N_TRUST_PROXY=true
    - N8N_PROTOCOL=https
    - VUE_APP_URL_BASE_API=https://${N8N_HOST}
    - WEBHOOK_TUNNEL_URL=https://${N8N_HOST}
    - N8N_EDITOR_BASE_URL=https://${N8N_HOST}
    - WEBHOOK_URL=https://${N8N_HOST}
    - N8N_RUNNERS_MODE=external
    - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
    - N8N_RUNNERS_BROKER_PORT=5679
    - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
    - N8N_LISTEN_ADDRESS=0.0.0.0
    - N8N_NATIVE_PYTHON_RUNNER=true
    - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    - N8N_SECURE_COOKIE=true
    - N8N_SAMESITE_COOKIE=none
    - N8N_PROXY_HOPS=1
    - N8N_COOKIE_DOMAIN=${N8N_HOST}
    - N8N_GRACEFUL_SHUTDOWN_TIMEOUT=30
    - EXTRA_NODE_MODULES=xlsx jszip adm-zip
    - NODE_FUNCTION_ALLOW_EXTERNAL=xlsx,jszip,adm-zip
  volumes:
    - n8n_data:/home/node/.n8n
  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  https:
    image: nginx:latest
    ports:
      #- '80:80'
      - '443:443'
    restart: always
    depends_on:
      n8n:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://localhost || exit 1"]
      interval: 6s
      timeout: 10s
      retries: 5
    networks:
      - n8n

  postgres:
    image: postgres:18
    restart: always
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - POSTGRES_NON_ROOT_USER
      - POSTGRES_NON_ROOT_PASSWORD
    volumes:
      - n8n_pg_storage:/var/lib/postgresql
      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 10s
      retries: 20
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - n8n

  redis:
    image: redis:6-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: always
    volumes:
      - n8n_redis_storage:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - n8n

  n8n:
    <<: *shared
    image: n8nio/n8n:stable
#    ports:
#      - 5678:5678
#      - 5679:5679
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/wget --server-response --proxy off --no-verbose --tries=1 --timeout=3 127.0.0.1:5678/healthz -O /dev/null 2>&1 | grep -q 'HTTP/1.1 200 OK'"]
      interval: 20s
      retries: 3
    networks:
      - n8n

  n8n-runner-1:
    image: n8nio/runners:stable
    restart: always
    environment:
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_MAX_CONCURRENCY=5
      - N8N_RUNNERS_PYTHON_ENABLE=true
    depends_on:
      - n8n
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f runner || exit 1"]
    networks:
      - n8n

  n8n-runner-2:
    image: n8nio/runners:stable
    restart: always
    environment:
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_MAX_CONCURRENCY=5
      - N8N_RUNNERS_PYTHON_ENABLE=true
    depends_on:
      - n8n
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f runner || exit 1"]
    networks:
      - n8n

  n8n-worker-1:
    <<: *shared
    image: n8nio/n8n:stable
    command: worker
    depends_on:
      - redis
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/wget --server-response --proxy off --no-verbose --tries=1 --timeout=3 127.0.0.1:5678/healthz -O /dev/null 2>&1 | grep -q 'HTTP/1.1 200 OK'"]
      interval: 20s
      retries: 3
    networks:
      - n8n

  n8n-worker-2:
    <<: *shared
    image: n8nio/n8n:stable
    command: worker
    depends_on:
      - redis
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/wget --server-response --proxy off --no-verbose --tries=1 --timeout=3 127.0.0.1:5678/healthz -O /dev/null 2>&1 | grep -q 'HTTP/1.1 200 OK'"]
      interval: 20s
      retries: 3
    networks:
      - n8n